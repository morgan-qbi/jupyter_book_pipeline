name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the production runtime on the build server.
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # CI=true lets the symlink tests run; they skip on a Windows checkout
        # without Developer Mode, which means the S-3 guard is only really
        # exercised here.
        env:
          CI: "true"
        run: pytest -q
